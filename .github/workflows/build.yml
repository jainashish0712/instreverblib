name: Build InstagramDash1440p Dylib

on:
  push:
    branches: [ main, master, dev, 1440p-try-2, "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile InstagramDash1440p.dylib
        run: |
          chmod +x build.sh
          ./build.sh
          ls -lh InstagramDash1440p.dylib InstagramReverb.dylib
          file InstagramDash1440p.dylib

      - name: Release Dylib (After Build Action Complete)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_TAG="v${{ github.run_number }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Tag this specific build
          git tag -f "$BUILD_TAG" HEAD
          git push origin -f tag "$BUILD_TAG" || true

          # Also update rolling latest tag
          git tag -f latest HEAD
          git push origin -f tag latest || true

          # Delete pre-existing release with this tag if re-run
          gh release delete "$BUILD_TAG" --yes || true

          # Create GitHub Release with direct raw uncompressed dylibs
          gh release create "$BUILD_TAG" InstagramDash1440p.dylib InstagramReverb.dylib \
            --title "InstagramDash1440p Build #${{ github.run_number }}" \
            --notes "Continuous build of InstagramDash1440p.dylib (commit ${{ github.sha }}). Direct uncompressed binary for LiveContainer, TrollStore, or Sideloading." \
            --latest
