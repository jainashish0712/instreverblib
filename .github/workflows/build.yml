name: Build InstagramReverb & InstagramDash1440p Dylibs

on:
  push:
    branches: [ main, master, dev, 1440p-try-2, "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile Both Dylibs
        run: |
          chmod +x build.sh
          ./build.sh
          file InstagramReverb.dylib
          file InstagramDash1440p.dylib
          file Instagram1440p.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tweaks
          path: |
            InstagramReverb.dylib
            InstagramDash1440p.dylib
            Instagram1440p.dylib

      - name: Release Dylibs (After Build Action Complete)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_TAG="v${{ github.run_number }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tag this specific build
          git tag -f "$BUILD_TAG" HEAD
          git push origin -f tag "$BUILD_TAG" || true
          
          # Also update rolling latest tag
          git tag -f latest HEAD
          git push origin -f tag latest || true
          
          # Delete pre-existing release with this tag if re-run
          gh release delete "$BUILD_TAG" --yes || true
          
          # Create GitHub Release with both raw uncompressed dylibs
          gh release create "$BUILD_TAG" \
            InstagramReverb.dylib \
            InstagramDash1440p.dylib \
            Instagram1440p.dylib \
            --title "Instagram Tweaks Build #${{ github.run_number }}" \
            --notes "Continuous build containing two separate dylibs: 1) InstagramReverb.dylib (Audio DSP: Reverb, Room, Pitch) and 2) InstagramDash1440p.dylib (Ultra HD 1440p VP9 DASH Video Engine). Direct uncompressed binaries for LiveContainer, TrollStore, or Sideloading." \
            --latest
