name: Build InstagramReverb Dylib

on:
  push:
    branches: [ main, master, dev, "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile InstagramReverb.dylib
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Publish Direct Raw Dylib (Rolling 'latest' Tag - No Zip)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Development Build"
          body: "Continuous build of InstagramReverb.dylib (raw uncompressed binary for LiveContainer)."
          prerelease: false
          files: InstagramReverb.dylib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Dylib Artifact (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: InstagramReverb.dylib
          path: InstagramReverb.dylib
