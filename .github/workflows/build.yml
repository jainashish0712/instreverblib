name: Build InstagramReverb Dylib

on:
  push:
    branches: [ "**" ]
    paths:
      - '**.m'
      - '**.mm'
      - '**.h'
      - '**.c'
      - 'build.sh'
      - 'Makefile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile InstagramReverb.dylib
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Publish Direct Raw Dylib (Rolling 'latest' Release - No Zip)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest HEAD
          git push origin -f tag latest
          gh release delete latest --yes || true
          gh release create latest InstagramReverb.dylib \
            --title "Latest Development Build" \
            --notes "Continuous build of InstagramReverb.dylib (raw uncompressed binary for LiveContainer)."

      - name: Upload Dylib Artifact (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: InstagramReverb.dylib
          path: InstagramReverb.dylib
